<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | Homem-Aranha</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

        :root {
            --ink: #171721;
            --muted: #71717d;
            --paper: #f2f2f4;
            --line: #d5d5dc;
            --accent: #e3262e;
            --accent-dark: #b7151d;
            --teal: #101d45;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 20px;
            color: var(--ink);
            background: var(--paper);
            font-family: 'DM Sans', sans-serif;
        }

        @keyframes pop-in {
            0% { opacity: 0; transform: translateY(28px) scale(0.96); }
            70% { transform: translateY(-7px) scale(1.01); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-14px, 10px) scale(1.04); }
        }

        .page {
            width: min(100%, 1000px);
            min-height: 620px;
            display: grid;
            grid-template-columns: 0.85fr 1.15fr;
            overflow: hidden;
            border: 1px solid rgba(23, 37, 45, 0.12);
            border-radius: 24px;
            background: #fbfdff;
            box-shadow: 0 24px 70px rgba(35, 18, 34, 0.2);
            animation: pop-in 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .welcome {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 46px;
            overflow: hidden;
            color: #fff;
            background: var(--teal);
            background-image: radial-gradient(circle at 75% 25%, rgba(227, 38, 46, 0.3), transparent 34%), linear-gradient(145deg, #182b68, #080d22);
        }

        .welcome::before,
        .welcome::after {
            position: absolute;
            content: '';
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: drift 8s ease-in-out infinite;
        }

        .welcome::before {
            width: 330px;
            height: 330px;
            right: -145px;
            top: 80px;
        }

        .welcome::after {
            width: 210px;
            height: 210px;
            left: -125px;
            bottom: -90px;
            animation-delay: -3s;
        }

        .brand {
            position: relative;
            z-index: 1;
            font-weight: 700;
            letter-spacing: 0.12em;
            font-size: 0.78rem;
        }

        .welcome-copy { position: relative; z-index: 1; }

        .hero-image {
            position: absolute;
            z-index: 1;
            width: min(58%, 250px);
            max-height: 280px;
            right: 8%;
            bottom: 14%;
            object-fit: contain;
            filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.3));
            opacity: 0.92;
            animation: float 4s ease-in-out infinite;
        }

        h1, h2, p { margin: 0; }

        .welcome h1 {
            max-width: 340px;
            margin-bottom: 18px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2.5rem, 5vw, 4.3rem);
            line-height: 0.98;
            letter-spacing: -0.04em;
        }

        .welcome p {
            max-width: 310px;
            color: rgba(255, 255, 255, 0.76);
            line-height: 1.6;
        }

        .mark {
            position: relative;
            z-index: 1;
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: #e3262e;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            animation: float 4s ease-in-out infinite;
        }

        .form-area { padding: 56px clamp(28px, 6vw, 76px); }

        .form-area h2 {
            margin-bottom: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            letter-spacing: -0.03em;
        }

        .subtitle {
            margin-bottom: 34px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        form { display: grid; gap: 18px; }

        .field { display: grid; gap: 7px; }

        label {
            color: var(--ink);
            font-size: 0.83rem;
            font-weight: 700;
        }

        input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 2px;
            padding: 14px 15px;
            outline: none;
            color: var(--ink);
            background: #fcfcfa;
            font: inherit;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        input:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(227, 38, 46, 0.18);
        }

        input:invalid:not(:placeholder-shown) { border-color: var(--accent); }

        button {
            margin-top: 8px;
            border: 0;
            border-radius: 2px;
            padding: 16px;
            cursor: pointer;
            color: #101629;
            background: var(--accent);
            font: inherit;
            font-weight: 700;
            transition: background 160ms ease, transform 160ms ease;
        }

        button:hover { background: var(--accent-dark); transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        .terms {
            margin-top: 2px;
            color: var(--muted);
            font-size: 0.75rem;
            line-height: 1.5;
            text-align: center;
        }

        .switch-button {
            display: block;
            margin-top: 2px;
            border: 1px solid var(--accent);
            border-radius: 2px;
            padding: 13px 16px;
            color: var(--accent-dark);
            font-size: 0.9rem;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            transition: background 160ms ease, color 160ms ease;
        }

        .switch-button:hover { color: #101629; background: var(--accent); }

        @media (max-width: 700px) {
            body { padding: 0; }
            .page { min-height: 100vh; grid-template-columns: 1fr; border: 0; border-radius: 0; }
            .welcome { min-height: 330px; padding: 30px 26px; }
            .welcome h1 { font-size: 3rem; }
            .mark { width: 44px; height: 44px; font-size: 1.15rem; }
            .form-area { padding: 38px 26px 44px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="welcome" aria-labelledby="welcome-title">
            <span class="brand">SPIDER &middot; ACCESS</span>
            <div class="welcome-copy">
                <h1 id="welcome-title">Seu sentido aranha.</h1>
                <p>Crie seu acesso e balance para uma nova jornada de aprendizagem.</p>
            </div>
            <span class="mark" aria-hidden="true">&#128375;</span>
        </section>

        <section class="form-area" aria-labelledby="form-title">
            <h2 id="form-title">Criar conta</h2>
            <p class="subtitle">Preencha seus dados para continuar.</p>
            <form id="signup-form">
                <div class="field">
                    <label for="name">Nome completo</label>
                    <input id="usuario" name="name" type="text" autocomplete="name" placeholder="Seu nome" required>
                </div>
                <div class="field">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required>
                </div>
                <div class="field">
                    <label for="password">Senha</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="M&iacute;nimo de 8 caracteres" required>
                </div>
                <button type="submit">Criar minha conta</button>
                <p class="terms">Ao continuar, voc&ecirc; concorda com os termos de uso.</p>
                <a class="switch-button" href="index2.html">J&aacute; tenho uma conta</a>
            </form>
        </section>
    </main>
    <script>
        const form = document.querySelector('#signup-form');
        const password = document.querySelector('#password');
        const confirmation = document.querySelector('#confirm-password');

        function validatePasswords() {
            confirmation.setCustomValidity(password.value === confirmation.value ? '' : 'As senhas precisam ser iguais.');
        }

        password.addEventListener('input', validatePasswords);
        confirmation.addEventListener('input', validatePasswords);
        form.addEventListener('submit', (event) => {
            validatePasswords();
            if (!form.checkValidity()) {
                event.preventDefault();
                form.reportValidity();
            }
        });
    </script>
</body>
</html>
